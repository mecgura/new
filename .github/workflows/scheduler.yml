# Runs MECGURA's scheduler every 5 minutes: scheduled WhatsApp campaigns, automation delays,
# scheduled Facebook/Instagram posts and webhook retries. It signs in with this repository's
# GitHub OIDC token (no stored secret); the app accepts only tokens issued for mecgura/new.
name: MECGURA scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mecgura-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run scheduled work
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mecgura-scheduler" | jq -r .value)
          curl -sS --fail-with-body -m 90 -H "Authorization: Bearer $TOKEN" https://mecgura.tech/api/cron/campaigns
          echo
