name: Scheduler
# Vercel Hobby only allows one cron run per day. This calls the same secured route every 5 minutes
# (reminders, message retries, escalations, subscription dunning, audit sealing).
# Needs repository secrets: APP_URL (e.g. https://health.mecgura.tech) and CRON_SECRET (same value as in Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduler route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET secrets are not set; skipping."; exit 0; fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/internal/communications/run")
          echo "HTTP $code"; head -c 600 /tmp/out.json; echo
          test "$code" = "200"
